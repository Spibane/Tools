<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aniimo Collection Checklists</title>
<link rel="stylesheet" href="../../../shared/base.css">
<script src="../../../shared/site.js"></script>
<link rel="stylesheet" href="../aniimo.css">
<link rel="stylesheet" href="style.css"></head><body><main>
<a class="back" href="../">Back to Aniimo</a>
<h1>Collection Checklists</h1>
<p class="intro">Every form, by sub-region or in one list in Aniilog order.</p>
<fieldset><legend>What to show</legend>
<div class="opt mode" role="radiogroup" aria-label="List"><span><input type="radio" name="mode" id="mode-region" value="region" checked><label for="mode-region">By region</label></span>
<span><input type="radio" name="mode" id="mode-all" value="all"><label for="mode-all">All forms in Aniilog order</label></span></div>
<div class="opt need-opt"><label for="opt-need">Only forms that need</label>
<select id="opt-need"><option value="">Anything</option><option value="none">Nothing special</option><option value="Rain">Rain</option><option value="Thunderstorm">Thunderstorm</option><option value="Snow">Snow</option><option value="Night">Night</option><option value="Prismana Flow">Prismana Flow</option><option value="Quest">Quest</option><option value="Title">Title</option></select></div>
<div class="opt marked"><span class="opt-title">Only forms marked<small>Percentages still count every form.</small></span>
<span><label for="opt-own">Own</label><select id="opt-own"><option value="">Any</option><option value="yes">Yes</option><option value="no">No</option></select></span>
<span><label for="opt-perfect">Perfect</label><select id="opt-perfect"><option value="">Any</option><option value="yes">Yes</option><option value="no">No</option></select></span>
<span><label for="opt-alpha">Alpha</label><select id="opt-alpha"><option value="">Any</option><option value="yes">Yes</option><option value="no">No</option></select></span>
<span><label for="opt-umbra">Umbral</label><select id="opt-umbra"><option value="">Any</option><option value="yes">Yes</option><option value="no">No</option></select></span></div>
</fieldset>
<p class="warn" id="warn" hidden></p>
<div id="regions"></div>
</main>
<script src="../data/forms.js"></script>
<script src="../data/categories.js"></script>
<script src="../data/spawns.js"></script>
<script>
const REGION_NAMES={breezy:"Breezy Plains",whisperwake:"Whisperwake Isles"};
const BOXES=[["own","Own"],["perfect","Perfect"],["alpha","Alpha"],["umbra","Umbral"]];
const SYMBOL={"Rain":"☂","Thunderstorm":"⚡","Rain or thunderstorm":"☂","Snow":"❄","Night":"☾","Prismana Flow":"✦"};
const keyOf=f=>f.form==="Base"?f.name:f.form+" "+f.name;
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-');
const BY_KEY=new Map(FORMS.map(f=>[keyOf(f),f]));
const ORDER=new Map(FORMS.map((f,i)=>[keyOf(f),i]));
const missing=[];
const known=k=>{if(BY_KEY.has(k))return true;if(!missing.includes(k))missing.push(k);return false;};
// Excluded forms from categories.js don't exist in the game
const EXCLUDE=new Set(CATEGORIES.exclude||[]);
EXCLUDE.forEach(known);
// Pick-one groups from categories.js share one row, under the first form's name, since a player can only own one
const PICKED=new Set();
for(const group of (CATEGORIES.pickOne||[])){
  const [keep,...rest]=group.filter(known);if(!rest.length)continue;
  const fs=[keep,...rest].map(k=>BY_KEY.get(k));
  BY_KEY.set(keep,{...fs[0],name:fs.map(f=>f.name).join(' / '),n:fs.map(f=>f.n).join('/')});
  rest.forEach(k=>PICKED.add(k));
}
// Gender forms from categories.js get a ♂ row and a ♀ row, next to each other
const GENDERED=(CATEGORIES.genders||[]).filter(known);
GENDERED.forEach(k=>['♂','♀'].forEach((g,i)=>{BY_KEY.set(k+' '+g,{...BY_KEY.get(k),gender:g});ORDER.set(k+' '+g,ORDER.get(k)+(i+1)/10);}));
const expand=row=>GENDERED.includes(row.form)?['♂','♀'].map(g=>({...row,form:row.form+' '+g})):[row];
const byOrder=(a,b)=>ORDER.get(a.form)-ORDER.get(b.form);

// Keepsake and event exclusives from categories.js, plus #10001+ forms not listed there, which count as events.
// They can't be caught in the wild, so they're left off the regions and get their own section.
const EXCLUSIVE=[["keepsake","Season 1 keepsakes","Season 1 keepsake",""],
  ["keepsake2","Season 2 keepsakes","Season 2 keepsake",""],
  ["event","One-time events","One-time event","No duplicates possible."]];
const LISTED=new Set(EXCLUSIVE.flatMap(([c])=>CATEGORIES[c]||[]));
const autoEvent=FORMS.filter(f=>f.region==="special"&&!LISTED.has(keyOf(f))).map(keyOf);
const skip=k=>EXCLUDE.has(k)||PICKED.has(k)||LISTED.has(k)||autoEvent.includes(k);

// Build each region's sub-regions: the wild spawns from spawns.js, then the region's other forms from forms.js
const REGIONS=Object.keys(REGION_NAMES).map(r=>{
  const subs=(SPAWNS[r]||[]).map(s=>({name:s.name,place:s.name,levels:s.levels,
    rows:s.rows.filter(row=>known(row.form)&&!skip(row.form)).flatMap(expand)}));
  const wild=new Set((SPAWNS[r]||[]).flatMap(s=>s.rows.map(row=>row.form)));
  const rest=FORMS.map(keyOf).filter(k=>BY_KEY.get(k).region===r&&!wild.has(k)&&!skip(k)).map(k=>({form:k})).flatMap(expand);
  if(rest.length)subs.push(subs.length
    ?{name:"Not found in the wild",place:"Not found in the wild in "+REGION_NAMES[r],note:"Get these by evolving, hatching or switching forms with a Morph Orb.",rows:rest}
    :{name:"Sub-region not known yet",place:REGION_NAMES[r]+", sub-region not known yet",rows:rest});
  return {id:r,name:REGION_NAMES[r],subs};
});
REGIONS.push({id:"exclusive",name:"Exclusives",subs:EXCLUSIVE.map(([c,name,place,note])=>({name,place,note,
  rows:[...(CATEGORIES[c]||[]),...(c==="event"?autoEvent:[])].filter(k=>known(k)&&!PICKED.has(k)).map(k=>({form:k})).flatMap(expand).sort(byOrder)}))
  .filter(s=>s.rows.length)});
// For the all-forms list: every form once, in Aniilog order, with each place it turns up and what it needs there
const PLACES=new Map();
REGIONS.forEach(r=>r.subs.forEach(s=>s.rows.forEach(row=>{
  if(!PLACES.has(row.form))PLACES.set(row.form,[]);
  PLACES.get(row.form).push({place:s.place,need:row.need,note:row.note});
})));
const ALL=[...PLACES.keys()].sort((a,b)=>ORDER.get(a)-ORDER.get(b));

// Everything is saved under aniimo-checklist.<name>. Older versions used the names in RENAMED, which move over on load,
// and before that the "Hide forms I own" checkbox (opt-hide), which becomes Own: No.
const KEY=n=>'aniimo-checklist.'+n;
const FILTERS=['need',...BOXES.map(([b])=>b)];
const RENAMED={checklist:KEY('collection'),'checklist-open':KEY('open'),'opt-mode':KEY('mode'),...Object.fromEntries(FILTERS.map(n=>['opt-'+n,KEY(n)]))};
if(store.get('opt-hide')==='1'&&store.get('opt-own')===null)store.set('opt-own','no');
store.remove('opt-hide');
store.rename(RENAMED);

// Collection: one entry per form, so a form is marked in every sub-region it spawns in
const collection=store.load(KEY('collection'),{});
const save=()=>store.save(KEY('collection'),collection);
const has=(k,b)=>!!(collection[k]&&collection[k][b]);
function setBox(k,b,on){
  const t=collection[k]||(collection[k]={});
  if(on){t[b]=true;if(b!=='own')t.own=true;if(b==='umbra')t.perfect=true;}// Umbral Aniimo always have Perfect potential
  else if(b==='own')delete collection[k];// Unchecking Own clears the rest of the row
  else delete t[b];
  if(collection[k]&&!Object.keys(collection[k]).length)delete collection[k];
  save();
}

const open=store.load(KEY('open'),{});
const pct=(n,d)=>d?Math.floor(n/d*100):0;
// Each box counts out of the forms that can have it, so Umbral leaves out Prismana forms
function stats(keys){
  const o={total:keys.length};
  BOXES.forEach(([b])=>{const able=keys.filter(k=>canHave(BY_KEY.get(k),b));o[b]=able.filter(k=>has(k,b)).length;o[b+'Of']=able.length;});
  return o;
}
const bar=(s,label)=>'<span class="pct"><span class="pct-n">'+pct(s.own,s.total)+'%</span><span class="meter" role="img" aria-label="'+esc(label)+' '+pct(s.own,s.total)+'% owned"><span style="width:'+pct(s.own,s.total)+'%"></span></span></span>';
const counts=s=>BOXES.map(([b,l])=>l+' '+s[b]+'/'+s[b+'Of']).join(' · ');
function needHTML(row){
  const tags=row.need||[];
  if(!tags.length)return '';
  const cls=t=>t==='Prismana Flow'?' flow':SYMBOL[t]?' wx':'';
  return '<div class="need">'+tags.map(t=>'<span class="chip'+cls(t)+'">'+(SYMBOL[t]?'<span aria-hidden="true">'+SYMBOL[t]+'</span> ':'')+esc(t)+'</span>').join('')+'</div>';
}
// A box is unavailable when the form can't have it. Prismana forms can't be Alpha or Umbral for now,
// one-off specials (#10001+ and one-time event forms) can't be Alpha, and forms.js marks others with umbral: false.
const EVENT_FORMS=new Set(CATEGORIES.event||[]);
const special=f=>f.region==='special'||EVENT_FORMS.has(keyOf(f));
const canHave=(f,b)=>b==='alpha'?!(f.form==='Prismana'||special(f)):b==='umbra'?!(f.form==='Prismana'||f.umbral===false):true;
// In the all-forms list a row shows where the form turns up and what it needs there.
// Places that need the same thing share a line.
function placesHTML(places){
  const groups=new Map();
  places.forEach(p=>{const g=JSON.stringify([p.need||[],p.note||'']);if(!groups.has(g))groups.set(g,{...p,names:[]});groups.get(g).names.push(p.place);});
  return '<ul class="where">'+[...groups.values()].map(p=>'<li><span class="place">'+esc(p.names.join(', '))+'</span>'+needHTML(p)+
    (p.note?'<p class="note">'+esc(p.note)+'</p>':'')+'</li>').join('')+'</ul>';
}
function rowHTML(row){
  const f=BY_KEY.get(row.form),k=row.form;
  const name=esc(f.name)+(f.form==='Base'?'':' <span class="form">'+esc(f.form)+' Form</span>')+(f.gender?' <span class="form">'+f.gender+'</span>':'');
  const plain=f.name+(f.form==='Base'?'':', '+f.form+' Form')+(f.gender?', '+(f.gender==='♂'?'male':'female'):'');
  return '<li class="row'+(has(k,'own')?' owned':'')+'" data-key="'+esc(k)+'">'+
    '<span class="sw e-'+f.element+(f.element2?' e2-'+f.element2:'')+'" aria-hidden="true"></span>'+
    '<div class="who"><span class="n">'+esc(f.n==='—'?'':'#'+f.n)+'</span> <b>'+name+'</b>'+
    (row.places?placesHTML(row.places):needHTML(row)+(row.note?'<p class="note">'+esc(row.note)+'</p>':''))+'</div>'+
    '<div class="boxes">'+BOXES.map(([b,l])=>canHave(f,b)
      ?'<label class="box"><input type="checkbox" data-box="'+b+'"'+(has(k,b)?' checked':'')+' aria-label="'+esc(l+': '+plain)+'"><span aria-hidden="true">'+l+'</span></label>'
      :'<label class="box off" title="'+esc(plain+' can’t be '+l)+'"><input type="checkbox" disabled aria-label="'+esc(l+': '+plain+', not possible')+'"><span aria-hidden="true">'+l+'</span></label>').join('')+'</div></li>';
}
function render(){
  const need=$('opt-need').value;
  const needs=tags=>!need||(need==='none'?!(tags||[]).length:(tags||[]).some(t=>t.toLowerCase().includes(need.toLowerCase())));// "Rain" also finds "Rain or thunderstorm"
  // Collection filters: each box can be required marked (yes) or unmarked (no). Forms that can't have a box are left out.
  const marked=BOXES.map(([b])=>[b,$('opt-'+b).value]).filter(([,v])=>v);
  const fits=k=>marked.every(([b,v])=>canHave(BY_KEY.get(k),b)&&has(k,b)===(v==='yes'));
  const filtered=need||marked.length;
  const show=row=>fits(row.form)&&(row.places?row.places.some(p=>needs(p.need)):needs(row.need));
  if($('mode-all').checked){
    const rows=ALL.map(k=>({form:k,places:PLACES.get(k)})),s=stats(ALL),vis=rows.filter(show);
    $('regions').innerHTML='<section class="region panel all" id="all-forms" aria-labelledby="all-h"><header><h2 id="all-h">All forms</h2>'+bar(s,'All forms')+
      '<p class="counts">'+ALL.length+' forms · '+counts(s)+'</p></header>'+
      (vis.length?'<ul class="rows">'+vis.map(rowHTML).join('')+'</ul>':'<p class="sub-note">No forms match.</p>')+'</section>';
    return;
  }
  const html=REGIONS.map(r=>{
    const all=[...new Set(r.subs.flatMap(s=>s.rows.map(row=>row.form)))],rs=stats(all);
    // With any filter in use, sub-regions (and regions) with no matches are left out
    const subs=r.subs.map(s=>{
      const id=r.id+'-'+slug(s.name),ss=stats(s.rows.map(row=>row.form)),vis=s.rows.filter(show);
      if(filtered&&!vis.length)return '';
      return '<details class="sub" id="'+id+'"'+(open[id]?' open':'')+'><summary><span class="sub-name">'+esc(s.name)+
        (s.levels?'<small>Lv '+esc(s.levels)+'</small>':'')+'</span>'+bar(ss,s.name)+'<span class="counts">'+counts(ss)+'</span></summary>'+
        (s.note?'<p class="sub-note">'+esc(s.note)+'</p>':'')+
        (vis.length?'<ul class="rows">'+vis.map(rowHTML).join('')+'</ul>':'<p class="sub-note">No forms match.</p>')+'</details>';
    }).join('');
    if(!subs)return '';
    return '<section class="region panel" aria-labelledby="'+r.id+'-h"><header><h2 id="'+r.id+'-h">'+esc(r.name)+'</h2>'+bar(rs,r.name)+
      '<p class="counts">'+all.length+' forms · '+counts(rs)+'</p></header>'+subs+'</section>';
  }).join('');
  $('regions').innerHTML=html||'<p class="warn">No forms match.</p>';
}

$('regions').addEventListener('change',e=>{
  const box=e.target.closest('input[data-box]');if(!box)return;
  setBox(box.closest('.row').dataset.key,box.dataset.box,box.checked);
  // Redraw, keeping keyboard focus on the same box
  const k=box.closest('.row').dataset.key,b=box.dataset.box,sub=box.closest('.sub,.all').id;
  render();
  const again=[...document.querySelectorAll('#'+sub+' .row')].find(r=>r.dataset.key===k);
  if(again)again.querySelector('[data-box="'+b+'"]').focus();
});
$('regions').addEventListener('toggle',e=>{
  if(!e.target.matches('.sub'))return;
  if(e.target.open)open[e.target.id]=1;else delete open[e.target.id];
  store.save(KEY('open'),open);
},true);
FILTERS.forEach(n=>{
  const el=$('opt-'+n);
  const v=store.get(KEY(n));if(v!==null)el.value=v;
  el.addEventListener('change',()=>{store.set(KEY(n),el.value);render();});
});
// List mode: by region, or every form in one list
if(store.get(KEY('mode'))==='all')$('mode-all').checked=true;
document.querySelectorAll('input[name="mode"]').forEach(el=>el.addEventListener('change',()=>{
  store.set(KEY('mode'),el.value);render();
}));

if(missing.length){$('warn').hidden=false;$('warn').textContent='These spawns.js or categories.js entries don’t match any form, so they aren’t shown: '+missing.join(', ')+'. Check the spelling against forms.js.';}
render();
backups({what:'collection',keys:[KEY('collection'),KEY('open'),KEY('mode'),...FILTERS.map(KEY)],file:'aniimo-region-collection.json',renamed:RENAMED,
  // Older backups from this page were {checklist: collection}
  legacy:f=>f&&f.checklist&&typeof f.checklist==='object'&&{[KEY('collection')]:JSON.stringify(f.checklist)}});
</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Outlast Trials Trial Randomizer</title>
<meta name="description" content="Rolls a random trial or MK-Challenge.">
<meta property="og:title" content="Outlast Trials Trial Randomizer">
<meta property="og:description" content="Rolls a random trial or MK-Challenge.">
<meta property="og:url" content="https://spibane.com/games/outlast-trials/randomizer/">
<meta property="og:site_name" content="Spibane's Tools for Everything">
<meta property="og:type" content="website">
<meta property="og:image" content="https://spibane.com/shared/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="../../../shared/base.css">
<script src="../../../shared/site.js"></script>
<script src="../data/trials.js"></script>
<link rel="stylesheet" href="style.css"></head><body><main>
<nav class="backs"><a class="back" href="../../../">Back to All Tools</a><a class="back" href="../">Back to The Outlast Trials</a></nav>
<h1>Trial Randomizer</h1>
<p class="intro">Rolls a random trial or MK-Challenge.</p>
<details class="settings"><summary><h2>Settings</h2></summary>
<div id="kinds"></div>
</details>
<section class="rolls panel" aria-labelledby="rolls-h">
<div class="roll-head"><h2 id="rolls-h">Your trial</h2><button type="button" class="roll" id="roll">Roll trial</button></div>
<label class="toggle"><input type="checkbox" id="use-played"> Leave out played trials</label>
<ol class="results" id="results" aria-live="polite"></ol>
<div class="played" id="played" hidden>
<p class="played-list" id="played-list"></p>
<button type="button" id="played-reset">Reset played</button>
</div>
</section>
</main>
<script>
let state=loadTrialSettings();
const save=()=>store.save('outlast',state);

const played=t=>state.usePlayed&&state.played.includes(t.id);
const candidates=()=>trialCandidates(state);

// Rolls a new trial, avoiding the current one while there's anything else
function roll(){
  const all=candidates(),fresh=all.filter(t=>t.id!==state.result);
  state.result=all.length?pick(fresh.length?fresh:all).id:null;
  save();renderResults();
}

function renderResults(){
  const t=trial(state.result),fits=t&&candidates().includes(t),none=!candidates().length;
  $('results').innerHTML='<li class="result'+(t?'':' empty')+'"><span class="r-pick">'+
    (t?kindTag(t)+'<b>'+esc(t.name)+'</b>'+(fits?'':' <span class="stale">'+(played(t)?'played':'left out')+', reroll</span>'):
      '<span class="muted">'+(none?'No trial left':'Not rolled yet')+'</span>')+'</span>'+
    '<span class="r-buttons">'+(state.usePlayed&&fits?'<button type="button" class="mark" aria-label="'+esc('Mark '+t.name+' as played')+'">Played</button>':'')+'</span></li>';
  // Counts against the ticked trials only
  const on=TRIALS.filter(t=>!state.off.includes(t.id)),list=state.played.map(trial).filter(t=>on.includes(t));
  $('played').hidden=!state.usePlayed||!list.length;
  $('played-list').innerHTML='<b>Played ('+list.length+' of '+on.length+'):</b> '+list.map(t=>esc(t.name)).join(', ');
  $('kinds').querySelectorAll('.trial').forEach(el=>el.classList.toggle('is-played',played(trial(el.querySelector('input').value))));
}

function renderCounts(){
  KINDS.forEach(k=>{
    const all=TRIALS.filter(t=>t.kind===k.id);
    $('count-'+k.id).textContent=all.filter(t=>!state.off.includes(t.id)).length+' of '+all.length+' on.';
  });
}

// One list per kind, grouped by Prime Asset
function render(){
  $('use-played').checked=state.usePlayed;
  $('kinds').innerHTML=KINDS.map(k=>'<fieldset data-k="'+k.id+'"><legend>'+k.title+'</legend><p class="hint" id="count-'+k.id+'"></p>'+
    ASSETS.filter(a=>LIST[k.id][a.id]).map(a=>'<div class="pill-group"><h3>'+a.name+'</h3><div class="pills">'+
      TRIALS.filter(t=>t.kind===k.id&&t.asset===a.id).map(t=>'<label class="trial pill"><input type="checkbox" value="'+t.id+'"'+(state.off.includes(t.id)?'':' checked')+'>'+esc(t.name)+'</label>').join('')+
    '</div></div>').join('')+
    '<div class="button-row"><button type="button" class="all">All</button> <button type="button" class="none">None</button></div></fieldset>').join('');
  renderCounts();renderResults();
}

$('roll').addEventListener('click',roll);
$('results').addEventListener('click',e=>{
  if(e.target.matches('.mark')){state.played.push(state.result);save();renderResults();}
});
$('use-played').addEventListener('change',e=>{state.usePlayed=e.target.checked;save();renderResults();});
$('played-reset').addEventListener('click',()=>{state.played=[];save();renderResults();});
$('kinds').addEventListener('change',()=>{
  state.off=[...$('kinds').querySelectorAll('.trial input:not(:checked)')].map(el=>el.value);
  save();renderCounts();renderResults();
});
// All and None only change their own list
$('kinds').addEventListener('click',e=>{
  if(!e.target.matches('.all,.none'))return;
  const ids=TRIALS.filter(t=>t.kind===e.target.closest('fieldset').dataset.k).map(t=>t.id);
  state.off=state.off.filter(id=>!ids.includes(id)).concat(e.target.matches('.none')?ids:[]);
  save();render();
});

render();
backups({what:'trial settings',keys:['outlast'],file:'outlast-trials-settings.json'});
</script></body></html>

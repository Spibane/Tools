<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FFXIV Relic Step Checklists</title>
<link rel="stylesheet" href="../../../shared/base.css">
<script src="../../../shared/site.js"></script>
<link rel="stylesheet" href="style.css"></head><body><main>
<a class="back" href="../">Back to Final Fantasy XIV</a>
<h1>Relic Step Checklists</h1>
<p class="intro">Every item each relic step needs, for all your weapons at once.</p>
<fieldset><legend>Relic</legend>
<div class="opt relic-pick" id="relic-pick" role="radiogroup" aria-label="Relic"></div>
</fieldset>
<fieldset><legend>Weapons to count</legend>
<div class="pills" id="jobs"></div>
<div class="button-row"><button type="button" id="jobs-all">All</button></div>
</fieldset>
<div id="steps"></div>
</main>
<script>
// Each data file adds one relic line: RELIC_DATA.push({id, expansion, name, weapons, steps}).
//   weapons: [{id:"PLD", job:"Paladin", label:"weapon name"}], one per piece that goes through the steps
//   steps:   [{name, quest, start, note, items, weaponItems, itemsSkip, sources}], in order
//     name        the stage the weapon reaches after the step (also used to save progress, so rename with care)
//     items       what every weapon needs: {name, qty (per weapon), buy:{currency, price, vendor}, source, perRelic}
//                 leave out buy when it can't be bought; perRelic: true means needed once for the whole line
//     weaponItems extra items for some weapons only, keyed by weapon id
//     itemsSkip   weapon ids that don't take the shared items
// Steps with nothing to turn in use items: [] and say what you do in note.
const RELIC_DATA=[];
</script>
<script src="../data/relics/arr.js"></script>
<script src="../data/relics/hw.js"></script>
<script src="../data/relics/sb.js"></script>
<script src="../data/relics/shb.js"></script>
<script src="../data/relics/ew.js"></script>
<script src="../data/relics/dt.js"></script>
<script>
// How much of a currency you can hold at once, shown so you know to buy as you go
const CAPS={"Allagan Tomestone of Poetics":2000,"Allagan Tomestone of Mathematics":2000,"Grand Company Seal":90000};
const CAP_NOTE={"Grand Company Seal":" at the top Grand Company rank"};
const num=n=>n.toLocaleString('en-US');
const chip=id=>id.replace(/-/g,' ');

// Progress: have = how many of each item you hold, per step; done = steps finished;
// skip = weapons left out of the totals, per relic
const state=Object.assign({have:{},done:{},skip:{}},store.load('relics'));
const save=()=>store.save('relics',state);
const open=store.load('relics-open',{});
let relic=RELIC_DATA.find(r=>r.id===store.get('relics-pick'))||RELIC_DATA[0];

const counted=r=>r.weapons.filter(w=>!(state.skip[r.id]||[]).includes(w.id));
const stepKey=(r,s)=>r.id+'/'+s.name;

// One line per item for a step: the per-weapon amount times the weapons counted,
// plus items only some weapons need. perRelic items are needed once for the whole line.
// Weapons in itemsSkip don't take the shared items (like the Zodiac shield, which mostly upgrades with the sword).
function linesFor(r,s){
  const ws=counted(r),lines=new Map();
  const add=(it,qty,w)=>{
    if(!lines.has(it.name))lines.set(it.name,{...it,need:0,for:[],shared:false});
    const l=lines.get(it.name);l.need+=qty;if(w)l.for.push(w);else l.shared=true;
  };
  const sharing=ws.filter(w=>!(s.itemsSkip||[]).includes(w.id)).length;
  if(sharing)(s.items||[]).forEach(it=>add(it,it.perRelic?it.qty:it.qty*sharing));
  ws.forEach(w=>((s.weaponItems||{})[w.id]||[]).forEach(it=>add(it,it.qty,chip(w.id))));
  return [...lines.values()].map(l=>l.shared?{...l,for:[]}:l);
}
// Bought items sit under their currency; everything else goes under Other items
function groupsFor(lines){
  const groups=new Map();
  lines.forEach(l=>{
    const g=l.buy?l.buy.currency:'';
    if(!groups.has(g))groups.set(g,[]);
    groups.get(g).push(l);
  });
  return [...groups.entries()].sort((a,b)=>(a[0]==='')-(b[0]===''));
}
const haveOf=(k,name)=>(state.have[k]||{})[name]||0;

let uid=0;
function lineHTML(k,l){
  const have=haveOf(k,l.name),plain=num(l.need)+' '+l.name,id='got-'+(++uid);
  const meta=[];
  if(l.perRelic)meta.push('Once for the whole line');
  if(l.for.length)meta.push('For '+l.for.join(', '));
  if(l.buy)meta.push(num(l.buy.price)+' each'+(l.buy.vendor?' from '+l.buy.vendor:''));
  if(l.source)meta.push(l.source);
  return '<li class="line" data-name="'+esc(l.name)+'" data-need="'+l.need+'" data-price="'+(l.buy?l.buy.price:0)+'">'+
    '<input type="checkbox" class="got" id="'+id+'"'+(have>=l.need?' checked':'')+' aria-label="'+esc('Have all '+plain)+'">'+
    '<div class="what"><label for="'+id+'"><span class="qty">'+num(l.need)+'</span> × <b>'+esc(l.name)+'</b></label>'+
    (meta.length?'<p class="meta">'+meta.map(esc).join(' · ')+'</p>':'')+'</div>'+
    '<div class="have"><label>Have <input type="number" min="0" inputmode="numeric" value="'+(have||'')+'" placeholder="0" aria-label="'+esc('How many '+l.name+' you have')+'"></label>'+
    '<span class="left"></span></div></li>';
}

function stepHTML(r,s,i){
  const k=stepKey(r,s),lines=linesFor(r,s),done=!!state.done[k];
  // A step opens by default when it's the first one you haven't finished
  const first=r.steps.findIndex(x=>!state.done[stepKey(r,x)])===i;
  const isOpen=k in open?open[k]:first;
  const body=lines.length?groupsFor(lines).map(([cur,ls])=>'<div class="group" data-cur="'+esc(cur)+'">'+
      '<h4>'+(cur?esc(cur)+'<span class="spend"></span>':lines.some(l=>l.buy)?'Other items':'Items')+'</h4>'+
      (cur&&CAPS[cur]?'<p class="cap">Holds up to '+num(CAPS[cur])+(CAP_NOTE[cur]||'')+', so buy as you go.</p>':'')+
      '<ul class="lines">'+ls.map(l=>lineHTML(k,l)).join('')+'</ul></div>').join('')
    :'<p class="none">No items needed</p>';
  return '<details class="step'+(done?' finished':'')+'" data-k="'+esc(k)+'"'+(isOpen?' open':'')+'><summary>'+
    '<span class="step-name"><small>Step '+(i+1)+'</small>'+esc(s.name)+'</span><span class="status"></span></summary>'+
    '<div class="step-body">'+
    (s.quest||s.start?'<p class="quest">'+(s.quest?'<b>'+esc(s.quest)+'</b>':'')+(s.start?' · starts with '+esc(s.start):'')+'</p>':'')+
    (s.note?'<p class="note">'+esc(s.note)+'</p>':'')+body+
    '<label class="finish"><input type="checkbox" class="done"'+(done?' checked':'')+'> Done on every weapon</label>'+
    (s.sources&&s.sources.length?'<p class="sources">Sources: '+s.sources.map((u,j)=>'<a href="'+esc(u)+'" rel="noopener">'+(j+1)+'</a>').join(' ')+'</p>':'')+
    '</div></details>';
}

// Works out the numbers that change as you type, straight from the page, so typing never redraws the list
function refresh(stepEl){
  let got=0,total=0;
  stepEl.querySelectorAll('.group').forEach(g=>{
    let spend=0,all=0;
    g.querySelectorAll('.line').forEach(li=>{
      const need=+li.dataset.need,price=+li.dataset.price;
      const have=haveOf(stepEl.dataset.k,li.dataset.name),short=Math.max(0,need-have);
      li.classList.toggle('got',!short);
      li.querySelector('.got').checked=!short;
      li.querySelector('.left').textContent=short?num(short)+' to go':'Got them all';
      spend+=short*price;all+=need*price;total++;if(!short)got++;
    });
    const sp=g.querySelector('.spend');
    if(sp)sp.textContent=spend?num(spend)+' left to spend of '+num(all):'All bought ('+num(all)+')';
  });
  const st=stepEl.querySelector('.status'),done=stepEl.classList.contains('finished');
  st.className='status'+(done?' is-done':!total||got===total?' is-ready':'');
  st.innerHTML=done?'Done':!total?'Nothing to buy':got===total?'Ready':
    got+' of '+total+' ready<span class="meter" aria-hidden="true"><span style="width:'+Math.floor(got/total*100)+'%"></span></span>';
}

function render(){
  $('relic-pick').innerHTML=RELIC_DATA.map(r=>'<span><input type="radio" name="relic" id="relic-'+r.id+'" value="'+r.id+'"'+(r===relic?' checked':'')+'>'+
    '<label for="relic-'+r.id+'">'+esc(r.expansion)+'<small>'+esc(r.name)+'</small></label></span>').join('');
  const skip=state.skip[relic.id]||[];
  $('jobs').innerHTML=relic.weapons.map(w=>'<label class="job pill" title="'+esc(w.job+(w.label?', '+w.label:''))+'"><input type="checkbox" value="'+esc(w.id)+'"'+(skip.includes(w.id)?'':' checked')+'>'+esc(chip(w.id))+'</label>').join('');
  const n=counted(relic).length;
  $('steps').innerHTML='<section class="relic panel"><header><h2>'+esc(relic.name)+'</h2><p class="counts">'+esc(relic.expansion)+' · '+relic.steps.length+' steps · counting '+n+' of '+relic.weapons.length+' weapons</p></header>'+
    relic.steps.map((s,i)=>stepHTML(relic,s,i)).join('')+'</section>';
  document.querySelectorAll('.step').forEach(refresh);
}

$('relic-pick').addEventListener('change',e=>{
  relic=RELIC_DATA.find(r=>r.id===e.target.value);
  store.set('relics-pick',relic.id);
  render();
});
$('jobs').addEventListener('change',()=>{
  state.skip[relic.id]=[...$('jobs').querySelectorAll('input:not(:checked)')].map(el=>el.value);
  save();render();
});
$('jobs-all').addEventListener('click',()=>{delete state.skip[relic.id];save();render();});

function setHave(stepEl,name,v){
  const k=stepEl.dataset.k,h=state.have[k]||(state.have[k]={});
  if(v>0)h[name]=v;else delete h[name];
  if(!Object.keys(h).length)delete state.have[k];
  save();refresh(stepEl);
}
$('steps').addEventListener('input',e=>{
  if(e.target.type!=='number')return;
  setHave(e.target.closest('.step'),e.target.closest('.line').dataset.name,Math.max(0,Math.floor(+e.target.value||0)));
});
$('steps').addEventListener('change',e=>{
  const stepEl=e.target.closest('.step');
  // Ticking an item fills in the full amount; unticking clears it
  if(e.target.matches('.got')){
    const li=e.target.closest('.line');
    setHave(stepEl,li.dataset.name,e.target.checked?+li.dataset.need:0);
    li.querySelector('input[type=number]').value=e.target.checked?li.dataset.need:'';
  }else if(e.target.matches('.done')){
    if(e.target.checked)state.done[stepEl.dataset.k]=true;else delete state.done[stepEl.dataset.k];
    stepEl.classList.toggle('finished',e.target.checked);
    save();refresh(stepEl);
  }
});
$('steps').addEventListener('toggle',e=>{
  if(!e.target.matches('.step'))return;
  open[e.target.dataset.k]=e.target.open;
  store.save('relics-open',open);
},true);

render();
backups({what:'relic progress',keys:['relics','relics-open','relics-pick'],file:'ffxiv-relic-progress.json',
  // Older backups from this page were {relics: progress}
  legacy:f=>f&&f.relics&&typeof f.relics==='object'&&{relics:JSON.stringify(f.relics)}});
</script></body></html>

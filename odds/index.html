<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Drop Odds</title>
<meta name="description" content="The chance a drop has dropped by now, and how many tries it usually takes.">
<meta property="og:title" content="Drop Odds">
<meta property="og:description" content="The chance a drop has dropped by now, and how many tries it usually takes.">
<meta property="og:url" content="https://spibane.com/odds/">
<meta property="og:site_name" content="Spibane's Tools for Everything">
<meta property="og:type" content="website">
<meta property="og:image" content="https://spibane.com/shared/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="../shared/base.css">
<script src="../shared/site.js"></script>
<link rel="stylesheet" href="style.css"></head><body><main>
<a class="back" href="../">Back to All Tools</a>
<h1>Drop Odds</h1>
<p class="intro">The chance a drop has dropped by now, and how many tries it usually takes.</p>
<form class="inputs panel" id="form" autocomplete="off" novalidate>
<label class="field">Drop chance <input type="text" id="rate" inputmode="decimal" aria-describedby="rate-hint"><span class="hint" id="rate-hint">Like 5%, 0.2% or 1/512</span></label>
<label class="field">Tries so far <span class="tries"><input type="number" id="tries" min="0" inputmode="numeric"><button type="button" id="plus" aria-label="Add a try">+1</button></span></label>
<label class="field">Drops wanted <input type="number" id="want" min="1" max="1000" inputmode="numeric"></label>
</form>
<section class="panel" aria-labelledby="out-h" aria-live="polite">
<h2 id="out-h">Your odds</h2>
<div id="out"></div>
</section>
</main>
<script>
// Saved data: rate (as typed), tries and want
let state=Object.assign({rate:'1/100',tries:0,want:1},store.load('odds'));
const save=()=>store.save('odds',state);

// The drop chance as a probability, from "5%", "5", "0.2%", "1/512" or "1 in 512". Plain numbers are percents.
function parseRate(s){
  s=s.trim().replace(/,/g,'');
  let m=s.match(/^(\d*\.?\d+)\s*(?:\/|in)\s*(\d*\.?\d+)$/i);
  const p=m?m[1]/m[2]:(m=s.match(/^(\d*\.?\d+)\s*%?$/))?m[1]/100:NaN;
  return p>0&&p<=1?p:NaN;
}

// The chance of at least k drops in n tries. Works in logs so huge try counts don't underflow.
function atLeast(p,n,k){
  if(k<=0)return 1;
  if(k>n)return 0;
  if(p>=1)return 1;
  const lq=Math.log1p(-p),step=Math.log(p)-lq;
  let lt=n*lq,max=lt;const terms=[lt];
  for(let i=0;i<k-1;i++){lt+=Math.log(n-i)-Math.log(i+1)+step;terms.push(lt);if(lt>max)max=lt;}
  const less=Math.exp(max)*terms.reduce((s,t)=>s+Math.exp(t-max),0);
  return Math.max(0,1-less);
}
// The fewest tries that give at least chance q of k drops
function triesFor(p,k,q){
  if(k===1)return p>=1?1:Math.max(1,Math.ceil(Math.log1p(-q)/Math.log1p(-p)));
  let lo=k,hi=k;
  while(atLeast(p,hi,k)<q)hi*=2;
  while(lo<hi){const mid=Math.floor((lo+hi)/2);if(atLeast(p,mid,k)>=q)hi=mid;else lo=mid+1;}
  return lo;
}

const num=n=>n.toLocaleString();
const pct=x=>x>=0.9999&&x<1?'over 99.99%':x>0&&x<0.0001?'under 0.01%':(x*100).toLocaleString(undefined,{maximumFractionDigits:x>=0.1&&x<=0.9?1:2})+'%';
const MILESTONES=[0.5,0.75,0.9,0.95,0.99,0.999];

function render(){
  const p=parseRate(state.rate),n=state.tries,k=state.want;
  $('rate').setAttribute('aria-invalid',isNaN(p));
  if(isNaN(p)){$('out').innerHTML='<p class="muted">Enter a drop chance, like 5%, 0.2% or 1/512.</p>';return;}
  const have=atLeast(p,n,k),what=k===1?'it':'at least '+k+' drops';
  $('out').innerHTML=
    '<p class="big"><b>'+pct(have)+'</b> chance of '+what+' by now</p>'+
    '<p class="muted">About 1 in '+num(+(1/p).toPrecision(4))+' per try. '+(e=>num(e)+(e===1?' drop':' drops'))(+(n*p).toFixed(2))+' expected in '+num(n)+' '+(n===1?'try':'tries')+'.</p>'+
    '<table><thead><tr><th scope="col">Chance</th><th scope="col">Tries</th><th scope="col">More to go</th></tr></thead><tbody>'+
    MILESTONES.map(q=>{const t=triesFor(p,k,q);return '<tr'+(t<=n?' class="past"':'')+'><td>'+pct(q)+'</td><td>'+num(t)+'</td><td>'+(t<=n?'Past it':num(t-n))+'</td></tr>';}).join('')+
    '</tbody></table>';
}

// Typing updates the odds straight away; leaving a box tidies its number
const whole=(v,min)=>Math.max(min,Math.min(1e9,Math.floor(+v)||0));
$('rate').addEventListener('input',e=>{state.rate=e.target.value;save();render();});
$('tries').addEventListener('input',e=>{state.tries=whole(e.target.value,0);save();render();});
$('want').addEventListener('input',e=>{state.want=Math.min(1000,whole(e.target.value,1));save();render();});
$('form').addEventListener('change',()=>{$('tries').value=state.tries;$('want').value=state.want;});
$('form').addEventListener('submit',e=>e.preventDefault());
$('plus').addEventListener('click',()=>{state.tries++;$('tries').value=state.tries;save();render();});

$('rate').value=state.rate;$('tries').value=state.tries;$('want').value=state.want;
render();
backups({what:'drop odds',keys:['odds'],file:'drop-odds.json'});
</script></body></html>

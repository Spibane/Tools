<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aniimo Collection Management</title>
<link rel="icon" href="../../shared/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../shared/base.css">
<script src="../../shared/site.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head><body><main>
<a class="back" href="../">Back to Aniimo</a>
<h1>Aniimo Collection Management</h1>
<p class="intro">Base and regional forms in Aniilog order, laid out as in-game boxes. Tile color shows the element.</p>
<fieldset><legend>What to show</legend>
<div class="opt"><input type="checkbox" id="opt-breezy"><label for="opt-breezy">Breezy Plains<small>#001–#082 and their regional forms.</small></label></div>
<div class="opt"><input type="checkbox" id="opt-whisperwake"><label for="opt-whisperwake">Whisperwake Isles<small>#084–#093 and their regional forms.</small></label></div>
<div class="opt"><input type="checkbox" id="opt-unreleased"><label for="opt-unreleased">Unknown<small>Aniimo not in the game yet, so their region isn’t known.</small></label></div>
<hr class="opt-rule">
<div class="opt"><input type="checkbox" id="opt-pris"><label for="opt-pris">Include Prismana forms<small>Placed with their species. Keepsake and event Prismana show with their own options.</small></label></div>
<div class="opt sub"><input type="checkbox" id="opt-prisgroup"><label for="opt-prisgroup">Group Prismana as their own category<small>Puts them together after the regions instead of with their species.</small></label></div>
<div class="opt"><input type="checkbox" id="opt-keep"><label for="opt-keep">Include Season 1 keepsake exclusives<small>Listed in <span class="ref" tabindex="0" data-ref="keepsake">categories</span>.</small></label></div>
<div class="opt"><input type="checkbox" id="opt-event"><label for="opt-event">Include one-time event specials<small>Listed in <span class="ref" tabindex="0" data-ref="event">categories</span>, plus any #10001+ form not listed there. Placed in Aniilog order with the rest. No duplicates possible.</small></label></div>
<div class="opt sub"><input type="checkbox" id="opt-eventgroup"><label for="opt-eventgroup">Group event specials as their own category<small>Puts them together after the keepsakes instead of in Aniilog order.</small></label></div>
<div class="opt"><input type="checkbox" id="opt-break"><label for="opt-break">Start each category on a new page</label></div>
</fieldset>
<p class="warn" id="warn" hidden></p>
<p class="count" id="count" aria-live="polite"></p>
<ul class="legend"><li><span style="background:var(--fire)"></span>Fire</li><li><span style="background:var(--water)"></span>Water</li><li><span style="background:var(--grass)"></span>Grass</li><li><span style="background:var(--electric)"></span>Lightning</li><li><span style="background:var(--ice)"></span>Ice</li><li><span style="background:var(--earth)"></span>Earth</li><li><span style="background:var(--wind)"></span>Wind</li><li><span style="background:var(--light)"></span>Light</li><li><span style="background:var(--dark)"></span>Dark</li><li><span style="background:var(--none)"></span>No element</li><li><span class="sw-pris"></span>Prismana</li><li><span class="sw-one"></span>One-time event</li></ul>
<nav aria-label="Pages" id="nav"></nav>
<div id="pages"></div>
</main>
<script src="../data/forms.js"></script>
<script src="../data/categories.js"></script>
<script>
const CATS={breezy:"Breezy Plains",whisperwake:"Whisperwake Isles",unreleased:"Unknown",prismana:"Prismana",keepsake:"Season 1 keepsakes",event:"One-time events"};
const ORDER=["breezy","whisperwake","unreleased","prismana","keepsake","event"];
const keyOf=f=>f.form==="Base"?f.name:f.form+" "+f.name;
const IN={};const missing=[];
for(const c of ["keepsake","event"]){for(const k of (CATEGORIES[c]||[])){
  if(!FORMS.some(f=>keyOf(f)===k))missing.push(k);IN[k]=c;}}
FORMS.forEach(f=>{f.category=IN[keyOf(f)]||(f.region==="special"?"event":f.region);f.oneTime=f.category==="event";f.prismana=f.form==="Prismana";});
// Excluded forms from categories.js don't exist in the game, so drop them
for(const k of (CATEGORIES.exclude||[])){
  const f=FORMS.find(f=>keyOf(f)===k);
  if(f)FORMS.splice(FORMS.indexOf(f),1);else if(!missing.includes(k))missing.push(k);
}
// Pick-one groups from categories.js share one tile, at the first form's place
for(const group of (CATEGORIES.pickOne||[])){
  const found=group.map(k=>FORMS.find(f=>keyOf(f)===k));
  group.forEach((k,i)=>{if(!found[i]&&!missing.includes(k))missing.push(k);});
  const [keep,...rest]=found.filter(Boolean);if(!rest.length)continue;
  keep.names=[keep,...rest].map(f=>f.name);keep.n=[keep,...rest].map(f=>f.n).join('/');keep.name=keep.names.join(' / ');
  rest.forEach(f=>FORMS.splice(FORMS.indexOf(f),1));
}
const autoEvent=FORMS.filter(f=>f.region==="special"&&!IN[keyOf(f)]).map(keyOf);
const EL={"fire": "Fire", "water": "Water", "grass": "Grass", "electric": "Lightning", "ice": "Ice", "earth": "Earth", "wind": "Wind", "light": "Light", "dark": "Dark", "none": "No element"};
const ROWS=[4,5,6,5,4];
const REGIONS=["breezy","whisperwake","unreleased"];
const OPTS=[...REGIONS,"pris","prisgroup","keep","event","eventgroup","break"];
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function chunk(a){const o=[];for(let i=0;i<a.length;i+=24)o.push(a.slice(i,i+24));return o;}
function render(){
  const o={};OPTS.forEach(k=>o[k]=$('opt-'+k).checked);
  $('opt-prisgroup').disabled=!o.pris;if(!o.pris)o.prisgroup=false;
  $('opt-eventgroup').disabled=!o.event;if(!o.event)o.eventgroup=false;
  const list=FORMS.filter(f=>{
    if(f.category==='keepsake')return o.keep;
    if(f.category==='event')return o.event;
    if(REGIONS.includes(f.category)&&!o[f.category])return false;
    if(f.prismana&&!o.pris)return false;
    return true;
  });
  list.forEach((f,i)=>{
    if(f.category==='event')f._c=(o.eventgroup||f.region==='special')?'event':f.region;
    else f._c=(o.prisgroup&&f.prismana&&f.category!=='keepsake')?'prismana':f.category;
    f._i=i;
  });
  list.sort((a,b)=>ORDER.indexOf(a._c)-ORDER.indexOf(b._c)||a._i-b._i);
  let pages=[];
  if(o.break){ORDER.forEach(c=>chunk(list.filter(f=>f._c===c)).forEach(p=>pages.push(p)));}
  else pages=chunk(list);
  $('count').textContent=list.length+' forms over '+pages.length+' page'+(pages.length===1?'':'s')+'.';
  $('nav').innerHTML=pages.map((_,i)=>'<a href="#page-'+(i+1)+'">'+(i+1)+'</a>').join(' ');
  let slot=0;
  $('pages').innerHTML=pages.map((p,pi)=>{
    const first=slot+1;slot+=p.length;const last=slot;let k=0;
    const cats=[...new Set(p.map(f=>CATS[f._c]))].join(', ');
    const rows=ROWS.map(r=>{let c='';for(let j=0;j<r;j++,k++){
      const f=p[k];
      if(!f){c+='<li class="hex empty" aria-hidden="true"><div></div></li>';continue;}
      const base=f.form==='Base';
      const lbl=f.name+(base?'':', '+f.form+' Form')+', '+EL[f.element]+(f.oneTime?', one-time event':'');
      const cls='hex e-'+f.element+(f.prismana?' pris':'')+(f.oneTime?' one':'');
      c+='<li class="'+cls+'" title="'+esc(lbl)+'"><div><span class="n">'+esc(f.n)+'</span><span class="nm'+(f.names?' multi':'')+'">'+(f.names?f.names.map(esc).join('<br>'):esc(f.name))+'</span>'+(base?'':'<span class="f">'+esc(f.form)+'</span>')+'</div></li>';
    }return '<ul class="row">'+c+'</ul>';}).join('');
    const text=p.map((f,i)=>(i+first)+'. '+f.n+' '+f.name+(f.form==='Base'?'':' ('+f.form+' Form)')+(f.oneTime?' [one-time]':'')).join('\n');
    return '<section class="page" id="page-'+(pi+1)+'" aria-labelledby="h'+(pi+1)+'"><header><h2 id="h'+(pi+1)+'">Page '+(pi+1)+'</h2><p>'+esc(cats)+', slots '+first+'–'+last+' of '+list.length+'</p><button type="button" class="copy" data-text="'+esc(text)+'">Copy this page as text</button></header><div class="comb">'+rows+'</div></section>';
  }).join('');
}
OPTS.forEach(k=>{
  const el=$('opt-'+k);
  el.checked=REGIONS.includes(k);
  try{const v=localStorage.getItem('opt-'+k);if(v!==null)el.checked=v==='1'}catch(_){}
  el.addEventListener('change',()=>{try{localStorage.setItem('opt-'+k,el.checked?'1':'0')}catch(_){}render();});
});
$('pages').addEventListener('click',async e=>{
  const b=e.target.closest('.copy');if(!b)return;const t=b.dataset.text,old=b.textContent;
  try{await navigator.clipboard.writeText(t);b.textContent='Copied';}
  catch(_){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');b.textContent='Copied';}catch(__){b.textContent='Copy failed';}a.remove();}
  setTimeout(()=>b.textContent=old,1600);
});
if(missing.length){$('warn').hidden=false;$('warn').innerHTML='These <span class="ref" tabindex="0" data-ref="missing">categories</span> entries don’t match any form, so they aren’t shown: '+esc(missing.join(', '))+'. Check the spelling against forms.js.';}
// Hover boxes on each categories.js mention, showing the entries that mention refers to
const TIPS={
  keepsake:['Season 1 keepsake exclusives (keepsake)',CATEGORIES.keepsake||[]],
  event:['One-time event specials (event)',CATEGORIES.event||[],autoEvent],
  missing:['Entries with no matching form',missing]
};
const tipList=a=>'<ul>'+a.map(k=>'<li>'+esc(k)+(missing.includes(k)?' <em>(no match)</em>':'')+'</li>').join('')+'</ul>';
document.querySelectorAll('.ref').forEach(r=>{
  const [title,list,extra]=TIPS[r.dataset.ref];
  r.insertAdjacentHTML('beforeend','<span class="tip" role="tooltip"><b>'+esc(title)+'</b>'+tipList(list)+
    (extra&&extra.length?'<b>Plus #10001+ forms not listed:</b>'+tipList(extra):'')+'</span>');
});
// A mention sits inside a checkbox label, so stop clicks on it from toggling the box
document.addEventListener('click',e=>{if(e.target.closest('.ref'))e.preventDefault();});
render();
// Size tile text to the widest name and form name in the data, so every tile matches and nothing wraps
function measureText(){
  const ctx=document.createElement('canvas').getContext('2d');
  const widest=(weight,texts)=>{ctx.font=weight+' 100px "Chakra Petch"';return Math.max(...texts.map(t=>ctx.measureText(t).width))/100;};
  const root=document.documentElement.style;
  root.setProperty('--nm-em',widest(700,FORMS.flatMap(f=>f.names||[f.name])));
  root.setProperty('--f-em',widest(400,FORMS.filter(f=>f.form!=='Base').map(f=>f.form)));
}
document.fonts.load('700 1em "Chakra Petch"').then(()=>document.fonts.load('400 1em "Chakra Petch"')).then(measureText,measureText);
</script></body></html>

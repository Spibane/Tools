<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Randomizer</title>
<meta name="description" content="Picks at random from your own lists.">
<meta property="og:title" content="Randomizer">
<meta property="og:description" content="Picks at random from your own lists.">
<meta property="og:url" content="https://spibane.com/randomizer/">
<meta property="og:site_name" content="Spibane's Tools for Everything">
<meta property="og:type" content="website">
<meta property="og:image" content="https://spibane.com/shared/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="../shared/base.css">
<script src="../shared/site.js"></script>
<link rel="stylesheet" href="style.css"></head><body><main>
<a class="back" href="../">Back to All Tools</a>
<h1>Randomizer</h1>
<p class="intro">Picks at random from your own lists.</p>
<section class="rolls panel" aria-labelledby="rolls-h">
<div class="roll-head"><h2 id="rolls-h">Your pick</h2><button type="button" class="roll" id="roll">Roll</button></div>
<div class="opts">
<label class="count">Pick <input type="number" id="count" min="1" max="50" inputmode="numeric"></label>
<label class="toggle"><input type="checkbox" id="cycle"> Use everything once before repeating</label>
</div>
<ol class="results" id="results" aria-live="polite"></ol>
<div class="used" id="used" hidden>
<p class="used-list" id="used-list"></p>
<button type="button" id="used-reset">Start over</button>
</div>
</section>
<fieldset>
<legend>Lists</legend>
<div class="list-row">
<select id="list" aria-label="List"></select>
<button type="button" id="list-add">New list</button>
<button type="button" id="list-delete">Delete</button>
</div>
<label class="field">Name <input type="text" id="name" autocomplete="off"></label>
<label class="field">Items <span class="hint">One per line. Repeat a line to make it more likely.</span>
<textarea id="items" rows="10" spellcheck="false"></textarea></label>
</fieldset>
</main>
<script>
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
// Saved data. lists: {id, name, text (the items, one per line), count (how many to pick), cycle (use everything once
// before repeating), used (items picked this round), result (the last pick), locked (indexes of picks Roll leaves alone)}.
// current is the id of the list on show.
const blank=name=>({id:uid(),name,text:'',count:1,cycle:false,used:[],result:[],locked:[]});
let state=Object.assign({lists:[],current:null},store.load('randomizer'));
if(!state.lists.length)state.lists.push(blank('My list'));
const save=()=>store.save('randomizer',state);
const L=()=>state.lists.find(l=>l.id===state.current)||state.lists[0];
const items=l=>l.text.split('\n').map(s=>s.trim()).filter(Boolean);
const unique=l=>[...new Set(items(l))];

// Rolls every pick that isn't locked. One roll never picks the same item twice, and with cycle on it
// skips items already used this round, starting a new round when there aren't enough left.
function roll(){
  const l=L(),all=items(l),n=Math.min(l.count,unique(l).length);
  const keep=l.result.map((r,i)=>l.locked.includes(i)&&all.includes(r)?r:null).slice(0,n);
  while(keep.length<n)keep.push(null);
  const free=used=>all.filter(x=>!keep.includes(x)&&!(l.cycle&&used.includes(x)));
  const need=keep.filter(x=>x===null).length;
  if(l.cycle&&new Set(free(l.used)).size<need)l.used=[];
  let pool=free(l.used);
  l.result=keep.map(x=>{
    if(x!==null)return x;
    const p=pick(pool);pool=pool.filter(y=>y!==p);
    if(l.cycle)l.used.push(p);
    return p;
  });
  l.locked=l.locked.filter(i=>i<n);
  save();renderResults();
}

const padlock=shackle=>'<svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><path d="'+shackle+'"/><rect x="2.5" y="7" width="11" height="8" fill="currentColor" stroke="none"/></svg>';
const LOCKED=padlock('M4.5 7V4.5a3.5 3.5 0 0 1 7 0V7'),UNLOCKED=padlock('M4.5 7V4.5a3.5 3.5 0 0 1 7 0');

function renderResults(){
  const l=L(),all=items(l);
  $('results').innerHTML=l.result.length?l.result.map((r,i)=>{
    const locked=l.locked.includes(i),gone=!all.includes(r);
    return '<li class="result'+(locked?' locked':'')+'"><span class="r-pick"><b>'+esc(r)+'</b>'+(gone?' <span class="stale">not in the list, reroll</span>':'')+'</span>'+
      '<span class="r-buttons"><button type="button" class="lock" data-i="'+i+'" aria-pressed="'+locked+'" aria-label="'+esc('Lock '+r)+'" title="'+(locked?'Unlock':'Lock')+'">'+(locked?LOCKED:UNLOCKED)+'</button></span></li>';
  }).join(''):'<li class="result empty"><span class="r-pick"><span class="muted">'+(all.length?'Not rolled yet':'Add some items below')+'</span></span></li>';
  const u=unique(l),used=u.filter(x=>l.used.includes(x));
  $('used').hidden=!l.cycle||!used.length;
  $('used-list').innerHTML='<b>Used ('+used.length+' of '+u.length+'):</b> '+used.map(esc).join(', ');
  $('roll').disabled=!all.length;
}

function render(){
  const l=L();state.current=l.id;
  $('list').innerHTML=state.lists.map(x=>'<option value="'+x.id+'"'+(x===l?' selected':'')+'>'+esc(x.name||'Untitled')+'</option>').join('');
  $('list-delete').disabled=state.lists.length<2;
  $('name').value=l.name;$('items').value=l.text;
  $('count').value=l.count;$('cycle').checked=l.cycle;
  renderResults();
}

$('roll').addEventListener('click',roll);
$('results').addEventListener('click',e=>{
  const b=e.target.closest('.lock');if(!b)return;
  const l=L(),i=+b.dataset.i;
  l.locked=l.locked.includes(i)?l.locked.filter(x=>x!==i):l.locked.concat(i);
  save();renderResults();
});
$('count').addEventListener('change',e=>{
  const l=L();l.count=Math.max(1,Math.min(50,Math.round(+e.target.value)||1));e.target.value=l.count;
  save();
});
$('cycle').addEventListener('change',e=>{L().cycle=e.target.checked;L().used=[];save();renderResults();});
$('used-reset').addEventListener('click',()=>{L().used=[];save();renderResults();});
$('list').addEventListener('change',e=>{state.current=e.target.value;save();render();});
$('list-add').addEventListener('click',()=>{
  const l=blank('List '+(state.lists.length+1));
  state.lists.push(l);state.current=l.id;save();render();$('name').select();
});
$('list-delete').addEventListener('click',()=>{
  const l=L();
  if(!confirm('Delete “'+(l.name||'Untitled')+'”?'))return;
  state.lists=state.lists.filter(x=>x!==l);state.current=state.lists[0].id;save();render();
});
$('name').addEventListener('input',e=>{
  L().name=e.target.value;save();
  $('list').selectedOptions[0].textContent=e.target.value||'Untitled';
});
$('items').addEventListener('input',e=>{L().text=e.target.value;save();renderResults();});

render();
backups({what:'lists',keys:['randomizer'],file:'randomizer-lists.json'});
</script></body></html>

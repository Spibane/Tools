<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dice Roller</title>
<meta name="description" content="Rolls dice like 2d6+3 or 4d6kh3, and flips coins.">
<meta property="og:title" content="Dice Roller">
<meta property="og:description" content="Rolls dice like 2d6+3 or 4d6kh3, and flips coins.">
<meta property="og:url" content="https://spibane.com/dice/">
<meta property="og:site_name" content="Spibane's Tools for Everything">
<meta property="og:type" content="website">
<meta property="og:image" content="https://spibane.com/shared/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="../shared/base.css">
<script src="../shared/site.js"></script>
<link rel="stylesheet" href="style.css"></head><body><main>
<a class="back" href="../">Back to All Tools</a>
<h1>Dice Roller</h1>
<p class="intro">Rolls dice like 2d6+3 or 4d6kh3, and flips coins.</p>
<section class="panel" aria-labelledby="roll-h">
<h2 id="roll-h" class="vh">Roll</h2>
<form class="roll-form" id="form" autocomplete="off">
<input type="text" id="expr" aria-label="Dice to roll" aria-describedby="expr-hint" spellcheck="false" autocapitalize="off">
<button type="submit" class="roll">Roll</button>
</form>
<p class="hint" id="expr-hint">kh3 keeps the highest 3, kl1 the lowest 1. d% is a d100.</p>
<div class="quick" id="quick"></div>
<div class="saved-row" id="saved"></div>
<div class="last" id="last" aria-live="polite"></div>
</section>
<section class="history" aria-labelledby="history-h">
<div class="history-head"><h2 id="history-h">History</h2><button type="button" id="history-clear">Clear</button></div>
<ol class="rolls-list" id="history"></ol>
</section>
</main>
<script>
// Saved data: expr (the last thing typed), saved (rolls kept as buttons) and history (newest first, up to 50 of
// {expr, total, parts}, where parts is the breakdown: {sign, dice, sides, rolls, kept (indexes)} or {sign, value})
let state=Object.assign({expr:'1d20',saved:[],history:[]},store.load('dice'));
const save=()=>store.save('dice',state);
const QUICK=[4,6,8,10,12,20,100];
// A fair roll from the browser's secure random numbers. Values in the uneven top slice are thrown away so no side comes up more.
const roll1=sides=>{
  const a=new Uint32Array(1),limit=2**32-2**32%sides;
  do crypto.getRandomValues(a);while(a[0]>=limit);
  return a[0]%sides+1;
};

// Reads "2d6+1d4-1", "4d6kh3", "d20" or "d%" into terms, or throws a message saying what's wrong
function parse(expr){
  const s=expr.replace(/\s+/g,'').toLowerCase();
  if(!s)throw 'Type some dice, like 2d6+3.';
  const terms=[],re=/([+-]?)(?:(\d*)d(\d+|%)(?:(kh|kl|k)(\d+))?|(\d+))/y;
  let i=0;
  while(i<s.length){
    re.lastIndex=i;const m=re.exec(s);
    if(!m||(!m[1]&&terms.length))throw 'Couldn’t read “'+expr.trim()+'”. Try something like 2d6+3.';
    const sign=m[1]==='-'?-1:1;
    if(m[6]!==undefined)terms.push({sign,value:+m[6]});
    else{
      const dice=m[2]===''?1:+m[2],sides=m[3]==='%'?100:+m[3],keep=m[5]===undefined?dice:+m[5];
      if(dice<1||dice>1000)throw 'Roll between 1 and 1,000 dice at a time.';
      if(sides<2||sides>1e6)throw 'Dice need between 2 and 1,000,000 sides.';
      if(keep<1||keep>dice)throw 'Keep between 1 and '+dice+' of '+dice+'d'+sides+'.';
      terms.push({sign,dice,sides,keep,low:m[4]==='kl'});
    }
    i=re.lastIndex;
  }
  return terms;
}

function rollExpr(expr){
  const parts=parse(expr).map(t=>{
    if(t.value!==undefined)return {sign:t.sign,value:t.value};
    const rolls=Array.from({length:t.dice},()=>roll1(t.sides));
    const order=rolls.map((v,i)=>i).sort((a,b)=>t.low?rolls[a]-rolls[b]:rolls[b]-rolls[a]);
    return {sign:t.sign,dice:t.dice,sides:t.sides,rolls,kept:order.slice(0,t.keep).sort((a,b)=>a-b)};
  });
  const total=parts.reduce((s,p)=>s+p.sign*(p.value!==undefined?p.value:p.kept.reduce((k,i)=>k+p.rolls[i],0)),0);
  return {expr:expr.replace(/\s+/g,''),total,parts};
}

function add(entry){
  state.history.unshift(entry);state.history.length=Math.min(state.history.length,50);
  save();render();
}
function rollIt(expr){
  try{add(rollExpr(expr));}
  catch(err){if(typeof err!=='string')throw err;$('last').innerHTML='<p class="error">'+esc(err)+'</p>';}
}

// One die is shown as its number, bold if kept and struck through if not; top and bottom rolls are marked
const die=(p,v,i)=>{
  const kept=p.kept.includes(i),edge=v===p.sides?' top':v===1?' bottom':'';
  return kept?'<b class="die'+edge+'">'+v+'</b>':'<s class="die">'+v+'</s>';
};
function breakdown(h){
  if(h.coin)return '';
  const parts=h.parts.map((p,j)=>(j?(p.sign<0?' − ':' + '):p.sign<0?'−':'')+
    (p.value!==undefined?p.value:'['+p.rolls.map((v,i)=>die(p,v,i)).join(' | ')+']'));
  // Coin flips (d2s) get a tally of heads and tails, with 1 as heads like the Coin button
  const flips=h.parts.filter(p=>p.sides===2&&p.rolls.length>1).flatMap(p=>p.kept.map(i=>p.rolls[i]));
  const tally=flips.length?' <span class="tally">'+flips.filter(v=>v===1).length+' heads | '+flips.filter(v=>v===2).length+' tails</span>':'';
  // A single die, or a plain number, has nothing more to show
  return h.parts.length===1&&(!h.parts[0].rolls||h.parts[0].rolls.length===1)?'':parts.join('')+tally;
}
const entry=h=>'<span class="h-expr">'+esc(h.coin?'Coin':h.expr)+'</span><span class="h-break">'+breakdown(h)+'</span><b class="h-total">'+esc(h.coin||h.total)+'</b>';

function render(){
  const h=state.history[0];
  $('last').innerHTML=h?'<p class="big">'+entry(h)+'</p>':'';
  $('history').innerHTML=state.history.slice(1).map(h=>'<li>'+entry(h)+'</li>').join('');
  $('history-clear').hidden=state.history.length<2;
  $('saved').innerHTML=state.saved.map((x,i)=>'<span class="chip"><button type="button" class="s-roll" data-i="'+i+'">'+esc(x)+'</button>'+
    '<button type="button" class="s-del" data-i="'+i+'" aria-label="'+esc('Remove '+x)+'">×</button></span>').join('')+
    '<button type="button" id="save-roll">Save this roll</button>';
}

$('quick').innerHTML=QUICK.map(n=>'<button type="button" data-d="'+n+'">d'+n+'</button>').join('')+'<button type="button" data-coin>Coin</button>';
$('form').addEventListener('submit',e=>{e.preventDefault();rollIt($('expr').value);});
$('expr').addEventListener('input',e=>{state.expr=e.target.value;save();});
$('quick').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.hasAttribute('data-coin'))return add({expr:'coin',coin:roll1(2)===1?'Heads':'Tails'});
  rollIt('1d'+b.dataset.d);
});
$('saved').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.id==='save-roll'){
    const x=$('expr').value.trim();
    try{parse(x);}catch(err){$('last').innerHTML='<p class="error">'+esc(err)+'</p>';return;}
    if(!state.saved.includes(x))state.saved.push(x);
  }
  else if(b.matches('.s-roll'))return rollIt(state.saved[+b.dataset.i]);
  else state.saved.splice(+b.dataset.i,1);
  save();render();
});
$('history-clear').addEventListener('click',()=>{state.history=state.history.slice(0,1);save();render();});

$('expr').value=state.expr;
render();
backups({what:'dice rolls',keys:['dice'],file:'dice-rolls.json'});
</script></body></html>
